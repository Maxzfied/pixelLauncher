name: "Cachix build"
# Needs the CACHIX_AUTH_TOKEN secret and a Cachix cache named "pixellauncher",
# so it only runs manually.
on:
  workflow_dispatch:

jobs:
  build-and-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v14
        with:
          name: pixellauncher
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: nix build | cachix push pixellauncher
      - run: |
          nix develop
          echo "OK"
